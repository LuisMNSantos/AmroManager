<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMRO — Registo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
    }
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: .4rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .lang-btn {
      background: none;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      padding: .25rem .55rem;
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
      color: #555;
    }
    .lang-btn.active, .lang-btn:hover {
      border-color: #1565C0;
      color: #1565C0;
      background: #e3f0ff;
    }
    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo h1 { font-size: 1.5rem; color: #1565C0; font-weight: 700; }
    .logo p  { color: #666; font-size: .9rem; margin-top: .25rem; }
    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #333;
      margin-bottom: .35rem;
      margin-top: 1rem;
    }
    input, textarea {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color .2s;
      outline: none;
      background: white;
      color: #333;
    }
    input:focus, textarea:focus { border-color: #1565C0; }
    input.invalid { border-color: #c62828; }
    textarea { resize: vertical; min-height: 80px; }

    /* ── Phone row ── */
    .phone-row { display: flex; gap: .5rem; }
    .phone-row input { flex: 1; min-width: 0; }

    /* ── Country prefix picker ── */
    .prefix-wrapper { position: relative; flex-shrink: 0; }
    .prefix-btn {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .65rem .75rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: .95rem;
      white-space: nowrap;
      color: #333;
      transition: border-color .2s;
      height: 100%;
      line-height: 1;
    }
    .prefix-btn:hover, .prefix-btn:focus { border-color: #1565C0; outline: none; }
    .prefix-btn.open { border-color: #1565C0; }
    .prefix-btn .pb-code { font-size: .9rem; font-weight: 600; }
    .prefix-arrow { font-size: .65rem; color: #999; transition: transform .15s; margin-left: .1rem; }
    .prefix-btn.open .prefix-arrow { transform: rotate(180deg); }

    .prefix-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 300;
      background: white;
      border: 1.5px solid #1565C0;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      width: 270px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      max-height: 300px;
    }
    .prefix-dropdown.open { display: flex; }
    .prefix-search-wrap {
      padding: .5rem .6rem;
      border-bottom: 1px solid #eee;
    }
    .prefix-search {
      width: 100%;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      padding: .45rem .65rem;
      font-size: .88rem;
      outline: none;
      background: #f8f9fa;
    }
    .prefix-search:focus { border-color: #1565C0; background: white; }
    .prefix-list { overflow-y: auto; flex: 1; }
    .prefix-item {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding: .5rem .75rem;
      cursor: pointer;
      font-size: .9rem;
      transition: background .08s;
    }
    .prefix-item:hover, .prefix-item.active { background: #e3f0ff; }
    .prefix-item .pi-name { flex: 1; color: #222; font-size: .88rem; }
    .prefix-item .pi-dial { color: #777; font-size: .82rem; font-weight: 600; }
    .prefix-empty {
      padding: .9rem .75rem;
      font-size: .88rem;
      color: #999;
      text-align: center;
    }

    .field-hint {
      font-size: .78rem;
      margin-top: .3rem;
      color: #c62828;
      display: none;
    }
    .field-hint.visible { display: block; }
    button[type=submit] {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: .8rem;
      background: #1565C0;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button[type=submit]:hover:not(:disabled) { background: #0d47a1; }
    button[type=submit]:disabled { background: #90caf9; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: .75rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
      display: none;
    }
    .msg.success { background: #e8f5e9; color: #2e7d32; display: block; }
    .msg.error   { background: #ffebee; color: #c62828; display: block; }
    .required { color: #c62828; }
    .hp-trap { position:absolute !important; left:-9999px !important; opacity:0 !important; height:0 !important; width:0 !important; pointer-events:none !important; }
  </style>
</head>

  <div class="card">
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('pt')">🇵🇹 PT</button>
      <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
      <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
      <button class="lang-btn" onclick="setLang('fr')">🇫🇷 FR</button>
      <button class="lang-btn" onclick="setLang('it')">🇮🇹 IT</button>
    </div>

    <div class="logo">
      <h1>AMRO</h1>
      <p id="t-subtitle">Registo de Residente</p>
    </div>

    <form id="form">
      <label id="t-name-label">Nome completo <span class="required">*</span></label>
      <input type="text" id="name" required autocomplete="name" />

      <label id="t-room-label">Número de quarto <span class="required">*</span></label>
      <input type="text" id="room" required autocomplete="off" />
      <span class="field-hint" id="room-hint"></span>

      <label id="t-phone-label">Telemóvel <span class="required">*</span></label>
      <div class="phone-row">
        <!-- Custom searchable country prefix picker -->
        <div class="prefix-wrapper" id="prefix-wrapper">
          <button type="button" class="prefix-btn" id="prefix-btn"
                  aria-haspopup="listbox" aria-expanded="false"
                  onclick="togglePrefixDropdown()">
            <span id="pb-flag">🇵🇹</span>
            <span class="pb-code" id="pb-code">+351</span>
            <span class="prefix-arrow">▾</span>
          </button>
          <div class="prefix-dropdown" id="prefix-dropdown" role="listbox">
            <div class="prefix-search-wrap">
              <input type="text" class="prefix-search" id="prefix-search"
                     placeholder="Pesquisar país ou código..."
                     autocomplete="off" oninput="filterCountries(this.value)" />
            </div>
            <div class="prefix-list" id="prefix-list"></div>
          </div>
        </div>
        <!-- Hidden input holds the actual dial code value -->
        <input type="hidden" id="prefix" value="+351" />
        <input type="tel" id="phone-local" required autocomplete="tel-national" />
      </div>

      <label id="t-notes-label">Notas (opcional)</label>
      <textarea id="notes"></textarea>

      <input class="hp-trap" type="text" name="website" autocomplete="off" tabindex="-1" aria-hidden="true" />
      <button type="submit" id="btn">Enviar pedido de registo</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

    // ── Prefix picker logic ──────────────────────────────────────────────────
    let _prefixOpen = false;
    let _selectedCountry = COUNTRIES[0]; // Portugal

    function renderList(q) {
      const list = document.getElementById('prefix-list');
      const lower = (q || '').toLowerCase().trim();
      const filtered = lower
        ? COUNTRIES.filter(c => c[1].toLowerCase().includes(lower) || c[2].includes(lower))
        : COUNTRIES;

      if (!filtered.length) {
        list.innerHTML = '<div class="prefix-empty">Nenhum resultado</div>';
        return;
      }

      list.innerHTML = filtered.map((c, i) =>
        `<div class="prefix-item${c === _selectedCountry ? ' active' : ''}"
              role="option" tabindex="-1"
              onmousedown="selectCountry(${COUNTRIES.indexOf(c)})">
          <span>${c[0]}</span>
          <span class="pi-name">${c[1]}</span>
          <span class="pi-dial">${c[2]}</span>
        </div>`
      ).join('');
    }

    function selectCountry(idx) {
      _selectedCountry = COUNTRIES[idx];
      document.getElementById('prefix').value   = _selectedCountry[2];
      document.getElementById('pb-flag').textContent = _selectedCountry[0];
      document.getElementById('pb-code').textContent = _selectedCountry[2];
      closePrefixDropdown();
    }

    function selectCountryByDial(dial) {
      const found = COUNTRIES.find(c => c[2] === dial) || COUNTRIES[0];
      const idx   = COUNTRIES.indexOf(found);
      _selectedCountry = found;
      document.getElementById('prefix').value        = found[2];
      document.getElementById('pb-flag').textContent = found[0];
      document.getElementById('pb-code').textContent = found[2];
    }

    function togglePrefixDropdown() {
      _prefixOpen ? closePrefixDropdown() : openPrefixDropdown();
    }

    function openPrefixDropdown() {
      _prefixOpen = true;
      const btn = document.getElementById('prefix-btn');
      const dd  = document.getElementById('prefix-dropdown');
      const sr  = document.getElementById('prefix-search');
      btn.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      dd.classList.add('open');
      sr.value = '';
      renderList('');
      sr.focus();
      // Scroll active item into view
      setTimeout(() => {
        const active = dd.querySelector('.prefix-item.active');
        if (active) active.scrollIntoView({ block: 'nearest' });
      }, 30);
    }

    function closePrefixDropdown() {
      _prefixOpen = false;
      const btn = document.getElementById('prefix-btn');
      const dd  = document.getElementById('prefix-dropdown');
      btn.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      dd.classList.remove('open');
    }

    function filterCountries(q) {
      renderList(q);
    }

    // Close on outside click
    document.addEventListener('mousedown', e => {
      if (_prefixOpen && !document.getElementById('prefix-wrapper').contains(e.target))
        closePrefixDropdown();
    });

    // Close on ESC
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && _prefixOpen) {
        closePrefixDropdown();
        document.getElementById('prefix-btn').focus();
      }
    });

    // ── Rooms validation ─────────────────────────────────────────────────────
    let _validRooms = null;

    (async function loadRooms() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rooms?select=number`, {
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
          }
        });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0)
            _validRooms = new Set(data.map(r => String(r.number).toUpperCase()));
        }
      } catch { /* skip */ }
    })();

    // ── i18n ─────────────────────────────────────────────────────────────────

    let currentLang = 'pt';

    function setLang(lang, clearMsg = true) {
      currentLang = lang;
      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.getElementById('t-subtitle').textContent    = t.subtitle;
      document.getElementById('t-name-label').innerHTML    = t.nameLabel  + ' <span class="required">*</span>';
      document.getElementById('t-room-label').innerHTML    = t.roomLabel  + ' <span class="required">*</span>';
      document.getElementById('t-phone-label').innerHTML   = t.phoneLabel + ' <span class="required">*</span>';
      document.getElementById('t-notes-label').textContent = t.notesLabel;
      document.getElementById('name').placeholder          = t.namePh;
      document.getElementById('room').placeholder          = t.roomPh;
      document.getElementById('phone-local').placeholder   = t.phonePh;
      document.getElementById('notes').placeholder         = t.notesPh;
      document.getElementById('prefix-search').placeholder = t.searchPh;
      document.getElementById('btn').textContent           = t.submit;
      selectCountryByDial(t.dialCode);
      document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.getAttribute('onclick').includes("'" + lang + "'")));
      if (clearMsg) {
        const msg = document.getElementById('msg');
        msg.className   = 'msg';
        msg.textContent = '';
      }
    }

    function showMsg(text, type) {
      const msg = document.getElementById('msg');
      msg.textContent = text;
      msg.className   = 'msg ' + type;
      msg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function setRoomError(text) {
      const hint  = document.getElementById('room-hint');
      const input = document.getElementById('room');
      if (text) {
        hint.textContent = text;
        hint.classList.add('visible');
        input.classList.add('invalid');
      } else {
        hint.textContent = '';
        hint.classList.remove('visible');
        input.classList.remove('invalid');
      }
    }

    setLang('pt');

    function rateLimit(key, max, windowMs) {
      const now = Date.now();
      let ts = [];
      try { ts = JSON.parse(localStorage.getItem(key) || '[]'); } catch {}
      ts = ts.filter(t => now - t < windowMs);
      if (ts.length >= max) {
        return { ok: false, wait: Math.ceil((windowMs - (now - ts[0])) / 1000) };
      }
      ts.push(now);
      try { localStorage.setItem(key, JSON.stringify(ts)); } catch {}
      return { ok: true };
    }

    document.getElementById('room').addEventListener('input', () => setRoomError(''));

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const t     = i18n[currentLang];
      const btn   = document.getElementById('btn');
      const name  = document.getElementById('name').value.trim();
      const room  = document.getElementById('room').value.trim().toUpperCase();
      const local = document.getElementById('phone-local').value.trim();
      const phone = local ? document.getElementById('prefix').value + local : null;
      const notes = document.getElementById('notes').value.trim() || null;

      if (!name || !room || !local) return;
      if (document.querySelector('#form .hp-trap')?.value) return;
      const rl = rateLimit('rl_amro_register', 3, 300000);
      if (!rl.ok) { showMsg(t.rateLimited(rl.wait), 'error'); return; }

      if (_validRooms !== null && !_validRooms.has(room)) {
        setRoomError(t.invalidRoom);
        return;
      }

      setRoomError('');
      btn.disabled    = true;
      btn.textContent = t.sending;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/pending_registrations`, {
          method: 'POST',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type':  'application/json',
            'Prefer':        'return=minimal'
          },
          body: JSON.stringify({ name, room_number: room, phone_number: phone, notes })
        });

        if (!res.ok) throw new Error(`${res.status}`);

        document.getElementById('form').reset();
        setLang(currentLang, false);
        showMsg(t.success, 'success');
      } catch {
        showMsg(t.error, 'error');
      } finally {
        btn.disabled    = false;
        btn.textContent = t.submit;
      }
    });
  </script>
