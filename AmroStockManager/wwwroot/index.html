<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AmroManager</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="AmroStockManager.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#10006;</a>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.amro = {
            getMainContentRect: function () {
                const el = document.querySelector('.mud-main-content');
                if (!el) return { left: 0, top: 0, width: 0, height: 0 };
                const r = el.getBoundingClientRect();
                return { left: Math.round(r.left), top: Math.round(r.top),
                         width: Math.round(r.width), height: Math.round(r.height) };
            },
            getElementRect: function (el) {
                if (!el) return { left: 0, top: 0, width: 0, height: 0 };
                const r = el.getBoundingClientRect();
                return { left: Math.round(r.left), top: Math.round(r.top),
                         width: Math.round(r.width), height: Math.round(r.height) };
            },
            // Returns the element's real top/left from the DOM flow, but fills height to the bottom of the window.
            getElementFillRect: function (el) {
                if (!el) return { left: 0, top: 0, width: 0, height: 0 };
                const r = el.getBoundingClientRect();
                return { left: Math.round(r.left), top: Math.round(r.top),
                         width: Math.round(r.width), height: Math.round(window.innerHeight - r.top) };
            },
            scrollToBottom: function (id) {
                var el = document.getElementById(id);
                if (el) el.scrollTop = el.scrollHeight;
            }
        };
    </script>
</body>

</html>
